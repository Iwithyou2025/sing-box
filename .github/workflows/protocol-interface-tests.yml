name: Per-protocol interface regression
on:
  pull_request:
  push:
    branches:
      - feature/per-protocol-bind-interface
jobs:
  shell-and-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n sing-box.sh
      - name: Run interface lifecycle tests
        run: bash tests/test_protocol_interfaces.sh
